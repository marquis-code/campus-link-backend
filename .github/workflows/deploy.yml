name: Kudihub Prod Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Set up BuildKit Docker container builder for modern multi-stage cache layers
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GitHub Container Registry (GHCR)
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image (heavy CPU work done on GitHub runners)
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy to DigitalOcean droplet via SSH
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            # Navigate to production project directory
            cd /var/www/kudihub-backend

            # Fetch any script or compose manifest changes from Git
            git pull

            # Authenticate droplet with GHCR to allow pulling the private container
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Set dynamic image tag corresponding to the pushed branch (master or main)
            export IMAGE_TAG=${{ github.ref_name }}

            # Pull the fresh pre-built container from GHCR
            docker compose -f docker-compose.prod.yml pull

            # Recreate containers with zero downtime (hot restart)
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans

            # Clean up old unused builders and dangling images to protect host disk health
            docker builder prune -af
            docker system prune -f
