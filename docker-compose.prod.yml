services:
  # ==========================================
  # Traefik v3.6 Reverse Proxy & SSL Router
  # ==========================================
  reverse-proxy:
    image: traefik:v3.6
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--certificatesresolvers.kudihubresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.kudihubresolver.acme.email=${ACME_EMAIL:-hello@kudihub.com}"
      - "--certificatesresolvers.kudihubresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - kudihub-net
    labels:
      - "traefik.enable=true"
      # HTTP-to-HTTPS Redirect
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  # ==========================================
  # Loopback Secured Redis Service
  # ==========================================
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - redis_data:/var/lib/redis/data
    networks:
      - kudihub-net

  # ==========================================
  # NestJS API Service (Behind Proxy)
  # ==========================================
  api:
    image: "ghcr.io/marquis-code/campus-link-backend:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    depends_on: [reverse-proxy, redis]
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - kudihub-net
    labels:
      - "traefik.enable=true"
      # HTTPS Routing & Cert Provisioning
      - "traefik.http.routers.api.rule=Host(`${DOMAIN:-api.kudihub.com}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=kudihubresolver"
      - "traefik.http.services.api.loadbalancer.server.port=3000"

networks:
  kudihub-net:

volumes:
  redis_data:
